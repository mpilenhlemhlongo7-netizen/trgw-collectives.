<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquiry Received | Matrix WebWorks</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0c0714">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230c0714'/%3E%3Ctext x='50' y='68' font-size='52' font-weight='bold' text-anchor='middle' fill='%23a56bff' font-family='Segoe UI,sans-serif'%3EM%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --ink-deep:#0c0714;--card:#1b1130;--line:rgba(190,160,255,.15);
    --accent:#a56bff;--accent-2:#ff5ec4;--btn-ink:#1d0a38;--text:#f0ebfb;--muted:#a89cc4;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Ubuntu,sans-serif;
    background:
      radial-gradient(900px 420px at 80% -10%,rgba(165,107,255,.14),transparent 60%),
      radial-gradient(700px 380px at 10% 110%,rgba(255,94,196,.08),transparent 60%),
      var(--ink-deep);
    color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .panel{
    max-width:520px;text-align:center;background:var(--card);
    border:1px solid var(--line);border-radius:14px;padding:48px 36px;
  }
  .tick{font-size:2.6rem;margin-bottom:16px}
  h1{font-size:1.6rem;margin-bottom:12px}
  p{color:var(--muted);margin-bottom:26px;line-height:1.6}
  .btn{
    display:inline-block;padding:12px 24px;border-radius:10px;font-weight:600;text-decoration:none;
    background:linear-gradient(135deg,var(--accent) 0%,var(--accent-2) 100%);color:var(--btn-ink);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="tick">✅</div>
    <h1>Enquiry received</h1>
    <p>Thank you for contacting Matrix WebWorks. You will receive a written quote and timeline within 48 hours. For anything urgent, WhatsApp us on 067 304 1992.</p>
    <a class="btn" href="/">Back to the site</a>
  </div>
</body>
</html>
