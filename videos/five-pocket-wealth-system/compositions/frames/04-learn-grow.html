<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is source-file metadata only; the runtime clones ONLY <template> contents -->
    <title>Frame 4 — Learn &amp; Grow</title>
  </head>
  <body>
    <template>
      <style>
        @import url("https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&display=swap");

        /* Root: style by #root, never a class — a class here gets scoped to a
           descendant selector at assembly and silently stops matching. */
        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
          container-type: size;
        }

        /* Runtime visibility marker — literal "clip" class, required for
           data-start/data-duration gating (a custom class name is ignored). */
        .clip {
          position: absolute;
          inset: 0;
        }

        /* --- ground (full-bleed, on a dedicated clip, never on #root) --- */
        .lg-bg {
          background: #0c1b32; /* ink navy */
        }

        /* --- label: "LEARN & GROW" mono-kicker, typed on --- */
        .lg-label-wrap {
          position: absolute;
          top: 11cqh;
          left: 0;
          width: 100%;
          display: flex;
          justify-content: center;
        }
        .lg-label {
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 4.6cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #faf8f2; /* cream */
          text-align: center;
          white-space: nowrap;
        }

        /* --- "2/5" progress marker (pill-badge — the one rounded chip) --- */
        .lg-marker {
          position: absolute;
          top: 10.4cqh;
          right: 7.4cqw;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 1.6cqw 2.6cqw;
          background: #faf8f2; /* cream */
          border: 0.4cqw solid #0c1b32; /* ink */
          border-radius: 999px;
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 3.2cqw;
          letter-spacing: 0.06em;
          color: #0c1b32; /* ink */
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        /* --- count-up ring: outline track + accent draw + centered number --- */
        .lg-ring-stage {
          /* Centered via a computed left offset, not a CSS transform — this
             element is GSAP-animated on `scale` (spring-pop-entrance), and a
             transform set in CSS would be silently overwritten by that tween. */
          position: absolute;
          top: 22.5cqh;
          left: 20cqw; /* (100cqw - 60cqw width) / 2 */
          width: 60cqw;
          height: 60cqw;
        }
        .lg-ring-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: visible;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }
        .lg-ring-svg circle {
          fill: none;
          stroke-width: 26;
          stroke-linecap: round;
        }
        #lg-ring-outline {
          stroke: #faf8f2; /* cream track, dimmed */
          opacity: 0.22;
        }
        #lg-ring-fill {
          stroke: #ce712c; /* orange (frame.md "yellow" token) — this pocket's accent */
          transform: rotate(-90deg);
          transform-origin: 50% 50%;
        }

        .lg-count-wrap {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: baseline;
          justify-content: center;
        }
        .lg-count {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          color: #ce712c; /* orange — matches the ring fill */
          font-variant-numeric: tabular-nums;
          font-size: 16cqw; /* GSAP tweens this inline */
          letter-spacing: -0.02em;
          line-height: 1;
        }
        .lg-count-suffix {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          color: #ce712c;
          font-size: 8cqw;
          opacity: 0;
          transform: translateY(14px);
          margin-left: 0.4cqw;
        }

        /* --- caption: builds below the ring on the voiceover tail --- */
        .lg-caption-wrap {
          position: absolute;
          top: 62.5cqh;
          left: 50%;
          width: 84cqw;
          transform: translateX(-50%);
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 0 1.2cqw;
        }
        .lg-word {
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 4.6cqw;
          letter-spacing: 0.05em;
          text-transform: uppercase;
          color: #faf8f2; /* cream */
          line-height: 1.35;
          text-align: center;
          opacity: 0;
          transform-origin: 50% 100%;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="04-learn-grow"
        data-width="1080"
        data-height="1920"
        data-duration="4"
      >
        <!-- full-bleed ground, its own clip (never a #root background) -->
        <div id="lg-bg" class="clip lg-bg" data-start="0" data-duration="4" data-track-index="0"></div>

        <!-- label -->
        <div id="lg-label-clip" class="clip" data-start="0" data-duration="4" data-track-index="1">
          <div class="lg-label-wrap">
            <div class="lg-label" id="lg-label"></div>
          </div>
        </div>

        <!-- "2/5" marker -->
        <div id="lg-marker-clip" class="clip" data-start="0" data-duration="4" data-track-index="2">
          <div class="lg-marker" id="lg-marker">2/5</div>
        </div>

        <!-- count-up ring + number -->
        <div id="lg-ring-clip" class="clip" data-start="0" data-duration="4" data-track-index="3">
          <div class="lg-ring-stage" id="lg-ring-stage">
            <svg class="lg-ring-svg" viewBox="0 0 300 300">
              <circle id="lg-ring-outline" cx="150" cy="150" r="130" />
              <circle id="lg-ring-fill" cx="150" cy="150" r="130" />
            </svg>
            <div class="lg-count-wrap">
              <span class="lg-count" id="lg-count">0</span><span class="lg-count-suffix" id="lg-suffix">%</span>
            </div>
          </div>
        </div>

        <!-- caption -->
        <div id="lg-caption-clip" class="clip" data-start="0" data-duration="4" data-track-index="4">
          <div class="lg-caption-wrap" id="lg-caption"></div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-1.3s): label types on, empty ring pops in ----

        // Ring outline + fill svg pop in together (spring-pop-entrance mechanics:
        // fromTo scale/opacity, power3.out, no overshoot) so the hero container
        // is on screen by t <= 0.5s even though its value lands later.
        tl.fromTo(
          "#lg-ring-stage",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          0.05,
        );

        // Measure the ring's true geometry (svg-path-draw mechanics) — never
        // hard-code the circumference.
        const lgRingFill = document.getElementById("lg-ring-fill");
        const lgRingOutline = document.getElementById("lg-ring-outline");
        const lgRingLen = lgRingFill.getTotalLength();
        [lgRingFill, lgRingOutline].forEach((c) => {
          c.style.strokeDasharray = `${lgRingLen}`;
        });
        lgRingFill.style.strokeDashoffset = `${lgRingLen}`; // fully hidden until Scene 2

        // Label typewriter (discrete-text-sequence: smooth character slice).
        const LG_LABEL_TEXT = "LEARN & GROW";
        const lgLabelEl = document.getElementById("lg-label");
        const lgLabelState = { v: 0 };
        tl.to(
          lgLabelState,
          {
            v: LG_LABEL_TEXT.length,
            duration: 0.9,
            ease: "power1.inOut",
            onUpdate: () => {
              lgLabelEl.textContent = LG_LABEL_TEXT.substring(0, Math.floor(lgLabelState.v));
            },
          },
          0.15,
        );

        // ---- Scene 2 (1.3-2.8s): ring fills orange, 0->20% counts up, "2/5" pips in ----

        const LG_TARGET = 20;
        const LG_COUNT_DUR = 1.3;
        const LG_COUNT_START = 1.35;
        const LG_START_SIZE = 100; // px, ~50% of end size
        const LG_END_SIZE = 194; // px

        // Ring fill draw (stat-bars-and-fills ring form) — same start/duration/ease
        // as the counter so number + graphic land as one beat.
        tl.to(
          lgRingFill,
          {
            strokeDashoffset: lgRingLen * (1 - LG_TARGET / 100),
            duration: LG_COUNT_DUR,
            ease: "power3.out",
          },
          LG_COUNT_START,
        );

        // Count-up with synchronized dynamic font-size (counting-dynamic-scale).
        const lgCountEl = document.getElementById("lg-count");
        const lgCountState = { value: 0, fontSize: LG_START_SIZE };
        tl.to(
          lgCountState,
          {
            value: LG_TARGET,
            fontSize: LG_END_SIZE,
            duration: LG_COUNT_DUR,
            ease: "power3.out",
            onUpdate: () => {
              lgCountEl.textContent = Math.round(lgCountState.value).toLocaleString();
              lgCountEl.style.fontSize = `${lgCountState.fontSize}px`;
            },
          },
          LG_COUNT_START,
        );

        // Suffix "%" arrives after the count lands.
        tl.to(
          "#lg-suffix",
          { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" },
          LG_COUNT_START + LG_COUNT_DUR,
        );

        // "2/5" marker pips in (spring-pop-entrance) just before the count settles.
        tl.fromTo(
          "#lg-marker",
          { scale: 0, opacity: 0, y: 16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          2.5,
        );

        // ---- Scene 3 (2.8-4.0s): caption builds below, hold ----

        const LG_CAPTION_WORDS = [
          "BUYS",
          "YOU",
          "KNOWLEDGE,",
          "BEFORE",
          "IT",
          "BUYS",
          "THINGS",
        ];
        const lgCaptionWrap = document.getElementById("lg-caption");
        LG_CAPTION_WORDS.forEach((word) => {
          const span = document.createElement("span");
          span.className = "lg-word";
          span.textContent = word;
          lgCaptionWrap.appendChild(span);
        });

        const LG_CAPTION_STAGGER = 0.06; // 7 words * 0.06 = 0.42s <= ~0.5s cap
        const LG_CAPTION_AT = 2.8;
        gsap.utils.toArray(".lg-word").forEach((el, i) => {
          tl.fromTo(
            el,
            { scale: 0.94, opacity: 0, y: 18 },
            { scale: 1, opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
            LG_CAPTION_AT + i * LG_CAPTION_STAGGER,
          );
        });

        window.__timelines["04-learn-grow"] = tl;
      </script>
    </template>
  </body>
</html>
