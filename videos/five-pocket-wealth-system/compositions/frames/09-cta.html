<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the HyperFrames runtime only
         clones <template> contents — everything needed for render lives inside it. -->
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Archivo Black";
          src: url("assets/fonts/archivo-black-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("assets/fonts/jetbrains-mono-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("assets/fonts/jetbrains-mono-700.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
        }

        /* Root: style by #root, never a class — see hyperframes-core sub-compositions.md Pitfall 3 */
        #root {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          overflow: hidden;
          container-type: size;
          font-family: "Archivo Black", sans-serif;
        }

        /* Full-bleed ground lives on a dedicated class="clip" layer, never on #root itself
           (hyperframes-core: "Full-bleed background on a class=clip layer, never #root"). */
        .bg-field {
          position: absolute;
          inset: 0;
          background: #0c1b32;
        }
        .bg-grid {
          position: absolute;
          inset: 0;
          background-image: repeating-linear-gradient(
              0deg,
              rgba(250, 248, 242, 0.1) 0px,
              rgba(250, 248, 242, 0.1) 1px,
              transparent 1px,
              transparent 96px
            ),
            repeating-linear-gradient(
              90deg,
              rgba(250, 248, 242, 0.1) 0px,
              rgba(250, 248, 242, 0.1) 1px,
              transparent 1px,
              transparent 96px
            );
        }

        .stage {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          padding-top: 300px;
          box-sizing: border-box;
        }

        /* Scene 1 — "FOLLOW" type-on, cream on navy (Frame 1 callback stage) */
        .follow-wrap {
          display: flex;
          align-items: baseline;
          justify-content: center;
          margin-bottom: 220px;
        }
        .follow-line {
          font-family: "Archivo Black", sans-serif;
          font-size: 4.2cqw;
          line-height: 0.92;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          color: #faf8f2;
          white-space: pre;
        }
        .caret {
          display: inline-block;
          width: 0.55cqw;
          height: 3.6cqw;
          margin-left: 0.6cqw;
          background: #faf8f2;
          transform-origin: 50% 50%;
        }

        /* Scene 2 — @TRGWCOLLECTIVES hero, lime, spring-pop payoff (signature move) */
        .handle {
          font-family: "Archivo Black", sans-serif;
          font-size: 8cqw;
          line-height: 0.92;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          text-align: center;
          color: #a6ce39;
          margin-bottom: 220px;
          transform-origin: 50% 50%;
          will-change: transform, opacity;
        }

        /* Scene 3 — book + author lockup, orange mono-label, builds in below and holds */
        .lockup-wrap {
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .lockup-title {
          font-family: "JetBrains Mono", monospace;
          font-size: 1.9cqw;
          font-weight: 700;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: #ce712c;
          margin-bottom: 12px;
          will-change: transform, opacity;
        }
        .lockup-author {
          font-family: "JetBrains Mono", monospace;
          font-size: 1.55cqw;
          font-weight: 400;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: #ce712c;
          will-change: transform, opacity;
        }
      </style>

      <div
        id="root"
        data-composition-id="09-cta"
        data-width="1080"
        data-height="1920"
        data-duration="8.128"
      >
        <div class="bg-field clip" data-start="0" data-duration="8.128" data-track-index="0">
          <div class="bg-grid"></div>
        </div>

        <div class="stage clip" data-start="0" data-duration="8.128" data-track-index="1">
          <div class="follow-wrap">
            <span class="follow-line" id="cta-follow-text"></span><span
              class="caret"
              id="cta-caret"
            ></span>
          </div>

          <div class="handle" id="cta-handle">@TRGW<br />COLLECTIVES</div>

          <div class="lockup-wrap" id="cta-lockup">
            <div class="lockup-title" id="lockup-title">THINK RICH, GROW WISE</div>
            <div class="lockup-author" id="lockup-author">MELOKUHLE NSIZWA MHLONGO</div>
          </div>
        </div>
      </div>

      <script src="assets/js/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const FOLLOW_TEXT = "FOLLOW";
        const TYPE_DUR = 0.75; // 6 chars @ 0.125s/char — conversational type-on
        const CARET_FADE_AT = 1.65; // begin caret fade before Scene 1 ends
        const CARET_GONE_AT = 1.8; // Scene 1 -> Scene 2 boundary
        const BLINK_PERIOD = 0.8; // seconds per full blink cycle

        const followTextEl = document.getElementById("cta-follow-text");
        const caretEl = document.getElementById("cta-caret");

        // Single time-driven master (discrete-text-sequence mechanics, smooth-slice
        // variation): one driver tween's onUpdate computes every derived state from
        // absolute time — deterministic under HF's frame-by-frame seek, no CSS
        // transitions, no per-tween interdependence.
        const master = { t: 0 };
        let lastTyped = null;
        tl.to(
          master,
          {
            t: 5,
            duration: 5,
            ease: "none",
            onUpdate: () => {
              const t = master.t;

              // --- Scene 1: FOLLOW type-on ---
              const ratio = Math.max(0, Math.min(1, t / TYPE_DUR));
              const typedCount = Math.floor(ratio * FOLLOW_TEXT.length);
              const typedText = FOLLOW_TEXT.slice(0, typedCount);
              if (typedText !== lastTyped) {
                followTextEl.textContent = typedText;
                lastTyped = typedText;
              }

              // --- Caret: solid while typing, sin-based blink through the hold,
              //     fades out into Scene 2 (no CSS animation — seek-safe) ---
              let caretOpacity = 0;
              if (t < TYPE_DUR) {
                caretOpacity = 1;
              } else if (t < CARET_FADE_AT) {
                const phase = ((t - TYPE_DUR) / BLINK_PERIOD) * Math.PI * 2;
                caretOpacity = Math.sin(phase) > 0 ? 1 : 0;
              } else if (t < CARET_GONE_AT) {
                caretOpacity = Math.max(
                  0,
                  1 - (t - CARET_FADE_AT) / (CARET_GONE_AT - CARET_FADE_AT),
                );
              }
              caretEl.style.opacity = caretOpacity;
            },
          },
          0,
        );

        // --- Scene 2 (1.8s): @TRGWCOLLECTIVES — spring-pop hero reveal (smooth
        //     long-tail settle, no bounce — project motion grammar bans overshoot) ---
        tl.fromTo(
          "#cta-handle",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          1.8,
        );

        // --- Scene 3 (3.2s): book + author lockup builds in below, then the full
        //     lockup (FOLLOW + handle + lockup) holds static to close — final frame,
        //     genuine settle/hold, no exit tween ---
        tl.fromTo(
          "#lockup-title",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          3.2,
        );
        tl.fromTo(
          "#lockup-author",
          { y: 20, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
          3.35,
        );

        window.__timelines["09-cta"] = tl;
      </script>
    </template>
  </body>
</html>
