<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime discards everything
         outside <template> — see hyperframes-core/references/sub-compositions.md -->
    <title>Frame 8 — Every rand, five jobs</title>
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Archivo Black";
          src: url("assets/fonts/archivo-black-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("assets/fonts/jetbrains-mono-400.woff2") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "JetBrains Mono";
          src: url("assets/fonts/jetbrains-mono-700.woff2") format("woff2");
          font-weight: 700;
          font-style: normal;
        }

        /* Root — styled by #root, never a class (subcomposition_root_styled_by_class). */
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          container-type: size;
          font-family: "JetBrains Mono", monospace;
        }

        /* Full-bleed ground — its own class="clip" layer, never painted on #root. */
        .bg {
          position: absolute;
          inset: 0;
          background: #faf8f2; /* cream card field — the breather beat */
        }

        .content {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .stage {
          margin-top: 16cqh;
          display: flex;
          flex-direction: column;
          align-items: center;
          width: 100%;
        }

        .ring-wrap {
          position: relative;
          width: 52cqw;
          height: 52cqw;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        .ring {
          display: block;
          width: 100%;
          height: 100%;
          transform: rotate(-90deg); /* fill starts at 12 o'clock, same as Frames 3-7 */
        }

        .ring-track {
          fill: none;
          stroke: rgba(12, 27, 50, 0.1);
          stroke-width: 7;
        }

        .seg {
          fill: none;
          stroke-width: 7;
          stroke-linecap: butt;
        }

        .center-label {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.4cqh;
        }

        .center-value {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 9cqw;
          line-height: 0.84;
          letter-spacing: -0.02em;
          color: #0c1b32;
          opacity: 0;
        }

        .center-sub {
          font-family: "JetBrains Mono", monospace;
          font-size: 1.1cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #6b6b6b;
          opacity: 0;
        }

        /* --- "ONE SYSTEM" wordmark card --- */
        .wordmark-card {
          margin-top: 6cqh;
          padding: 1.4cqh 4cqw;
          background: #0c1b32;
          border-radius: 0.6cqw;
          opacity: 0;
          transform: translateY(16px);
        }

        .wordmark {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 4.6cqw;
          letter-spacing: -0.01em;
          text-transform: uppercase;
          color: #faf8f2;
          line-height: 1;
        }

        /* --- Caption build --- */
        .caption {
          margin-top: 5cqh;
          max-width: 78cqw;
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          row-gap: 0.8cqh;
          column-gap: 0.8cqw;
        }

        .word {
          font-family: "JetBrains Mono", monospace;
          font-weight: 400;
          font-size: 1.35cqw;
          letter-spacing: 0.06em;
          text-transform: uppercase;
          color: #ce712c; /* secondary accent — caption */
        }
      </style>

      <div
        id="root"
        data-composition-id="08-recap"
        data-width="1080"
        data-height="1920"
        data-duration="4.5"
      >
        <div id="bg" class="clip bg" data-start="0" data-duration="4.5" data-track-index="0"></div>

        <div id="content" class="clip content" data-start="0" data-duration="4.5" data-track-index="1">
          <div class="stage">
            <div class="ring-wrap" id="ringWrap">
              <svg class="ring" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle class="ring-track" cx="50" cy="50" r="42" />
                <!-- Five segments, alternating lime/orange, matching each pocket's
                     accent from Frames 3-7: Owner's Equity 15 (lime), Learn & Grow 20
                     (orange), Petty Cash 15 (lime), Reinvestment 25 (orange),
                     Emergency Fund 25 (lime). Sums to exactly 100%. -->
                <circle class="seg" id="seg1" cx="50" cy="50" r="42" stroke="#a6ce39" />
                <circle class="seg" id="seg2" cx="50" cy="50" r="42" stroke="#ce712c" />
                <circle class="seg" id="seg3" cx="50" cy="50" r="42" stroke="#a6ce39" />
                <circle class="seg" id="seg4" cx="50" cy="50" r="42" stroke="#ce712c" />
                <circle class="seg" id="seg5" cx="50" cy="50" r="42" stroke="#a6ce39" />
              </svg>
              <div class="center-label">
                <span class="center-value" id="centerValue">100%</span>
                <span class="center-sub" id="centerSub">ALLOCATED</span>
              </div>
            </div>

            <div class="wordmark-card" id="wordmarkCard">
              <div class="wordmark">ONE SYSTEM</div>
            </div>

            <div class="caption" id="caption">
              <span class="word">EVERY</span>
              <span class="word">RAND</span>
              <span class="word">ALREADY</span>
              <span class="word">HAS</span>
              <span class="word">A</span>
              <span class="word">JOB</span>
            </div>
          </div>
        </div>
      </div>

      <script src="assets/js/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-1.5s): on "five pockets" — five segments cascade in and
        // self-assemble into one ring (grid-card-assemble signature: N items stagger-
        // assemble into their final slots) ----

        // Percentages from Frames 3-7, in list order. Sums to 100.
        const PCTS = [15, 20, 15, 25, 25];
        const IDS = ["seg1", "seg2", "seg3", "seg4", "seg5"];

        tl.fromTo(
          "#ringWrap",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.4, ease: "power3.out" },
          0,
        );

        // Build each segment's arc geometry (measured, never hard-coded) and animate
        // its stroke-dashoffset in from "hidden" to "drawn" — one per pocket, staggered.
        let cumulative = 0;
        IDS.forEach((id, i) => {
          const el = document.getElementById(id);
          const circumference = el.getTotalLength();
          const segLen = (PCTS[i] / 100) * circumference;
          const gapLen = circumference - segLen;
          el.style.strokeDasharray = `${segLen} ${gapLen}`;
          // Position this segment's start at its cumulative offset around the ring.
          const rotateDeg = (cumulative / 100) * 360;
          el.style.transformOrigin = "50% 50%";
          el.style.transform = `rotate(${rotateDeg}deg)`;
          // Start fully hidden (dash pulled back), draw on to reveal.
          el.style.strokeDashoffset = `${segLen}`;

          tl.to(
            el,
            {
              strokeDashoffset: 0,
              duration: 0.55,
              ease: "power2.out",
            },
            0.15 + i * 0.16,
          );

          cumulative += PCTS[i];
        });

        // Center "100% ALLOCATED" fades in once the ring is fully assembled.
        tl.fromTo(
          "#centerValue",
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
          1.15,
        );
        tl.fromTo(
          "#centerSub",
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: "power3.out" },
          1.3,
        );

        // ---- Scene 2 (1.5-3.0s): on "one system" — wordmark locks in ----

        tl.to(
          "#wordmarkCard",
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          1.6,
        );

        // ---- Scene 3 (3.0-4.5s): caption builds below, whole composition holds ----

        const words = gsap.utils.toArray("#caption .word");
        words.forEach((w, i) => {
          tl.fromTo(
            w,
            { opacity: 0, y: 16 },
            { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
            3.0 + i * 0.1,
          );
        });

        // Faint hold jitter on the ring, matching Frames 3-7's idle treatment.
        const ringWrapEl = document.getElementById("ringWrap");
        const idlePhase = { p: 0 };
        tl.to(
          idlePhase,
          {
            p: Math.PI * 2,
            duration: 1.5,
            ease: "none",
            onUpdate: () => {
              const s = 1 + Math.sin(idlePhase.p) * 0.008;
              ringWrapEl.style.transform = `scale(${s})`;
            },
          },
          3.0,
        );

        window.__timelines["08-recap"] = tl;
      </script>
    </template>
  </body>
</html>
