<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata for the source file only; the runtime discards it and clones
         only <template> contents. See hyperframes-core/references/sub-compositions.md. -->
  </head>
  <body>
    <template>
      <style>
        /* Google Fonts import — no local font files exist in this project yet, so
           @import is the sanctioned fallback (frame-worker.md font_family_without_font_face). */
        @import url("https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap");

        /* Root styled by #root only — a class on the data-composition-id element
           gets scoped out at assembly and silently drops (subcomposition_root_styled_by_class). */
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          font-family: "JetBrains Mono", monospace;
        }

        /* Full-bleed ground lives on its own class="clip" layer, never painted on #root. */
        .f2-bg {
          position: absolute;
          inset: 0;
          background: #0c1b32;
        }

        .f2-card {
          position: absolute;
          left: 90px;
          top: 280px;
          width: 900px;
          height: 1180px;
        }

        /* The wipe layer — cream fill only. Kept separate from the text content layer
           so the scaleX wipe never distorts the type sitting on top of it. */
        .f2-card-fill {
          position: absolute;
          inset: 0;
          display: block;
          background: #faf8f2;
          border: 4px solid #0c1b32;
          box-shadow:
            14px 14px 0 #a6ce39,
            14px 14px 0 4px #0c1b32;
          transform-origin: left center;
        }

        .f2-card-content {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 44px;
          padding: 90px 70px;
        }

        .f2-kicker {
          font-family: "JetBrains Mono", monospace;
          font-weight: 700;
          font-size: 34px;
          letter-spacing: 0.14em;
          color: #0c1b32;
          text-transform: uppercase;
          text-align: center;
          min-height: 42px;
        }

        .f2-wordmark {
          display: flex;
          flex-direction: column;
          align-items: center;
        }

        .f2-word-line {
          font-family: "Archivo Black", sans-serif;
          font-weight: 400;
          font-size: 74px;
          line-height: 0.92;
          letter-spacing: -0.01em;
          color: #0c1b32;
          text-transform: uppercase;
          text-align: center;
          white-space: nowrap;
        }

        .f2-underline-svg {
          display: block;
          width: 460px;
          height: 16px;
          overflow: visible;
        }

        .f2-underline-line {
          fill: none;
          stroke: #a6ce39;
          stroke-width: 8;
          stroke-linecap: round;
        }

        .f2-caption {
          font-family: "JetBrains Mono", monospace;
          font-weight: 500;
          font-size: 26px;
          letter-spacing: 0.06em;
          color: #ce712c;
          text-transform: uppercase;
          text-align: center;
          opacity: 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="02-intro"
        data-width="1080"
        data-height="1920"
        data-duration="4"
      >
        <!-- Scene 1 (0.0-2.0s): navy ground established, cream card wipes in as
             "MEET THE" types on. -->
        <div
          id="f2-bg"
          class="f2-bg clip"
          data-start="0"
          data-duration="4"
          data-track-index="0"
        ></div>

        <div
          id="f2-card"
          class="f2-card clip"
          data-start="0"
          data-duration="4"
          data-track-index="1"
        >
          <div id="f2-card-fill" class="f2-card-fill"></div>

          <div class="f2-card-content">
            <div id="f2-kicker" class="f2-kicker"></div>

            <!-- Scene 2 (2.0-3.2s): wordmark slides up, lime underline draws on left-to-right. -->
            <div id="f2-wordmark" class="f2-wordmark">
              <div class="f2-word-line">FIVE POCKET</div>
              <div class="f2-word-line">WEALTH SYSTEM</div>
            </div>

            <svg class="f2-underline-svg" viewBox="0 0 460 16" xmlns="http://www.w3.org/2000/svg">
              <line id="f2-underline-line" class="f2-underline-line" x1="0" y1="8" x2="460" y2="8" />
            </svg>

            <!-- Scene 3 (3.2-4.0s): source caption fades in, whole card holds — the breather. -->
            <div id="f2-caption" class="f2-caption">FROM THINK RICH, GROW WISE</div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        (function () {
          window.__timelines = window.__timelines || {};

          // Measure the underline path synchronously at setup — SVG is inline so
          // getTotalLength() is safe here (svg-path-draw.md).
          var underlinePath = document.getElementById("f2-underline-line");
          var underlineLen = underlinePath.getTotalLength();
          underlinePath.style.strokeDasharray = underlineLen;
          underlinePath.style.strokeDashoffset = underlineLen;

          var kickerEl = document.getElementById("f2-kicker");
          var kickerText = "MEET THE";
          var kickerProxy = { v: 0 };

          var tl = gsap.timeline({ paused: true });

          // Scene 1 — cream card wipes in over the navy ground (scaleX wipe on the
          // fill layer only, so the text layer on top is never distorted).
          tl.fromTo(
            "#f2-card-fill",
            { scaleX: 0 },
            { scaleX: 1, duration: 0.55, ease: "power3.out" },
            0,
          );

          // Scene 1 — "MEET THE" types on (smooth character slice, discrete-text-sequence.md).
          tl.to(
            kickerProxy,
            {
              v: kickerText.length,
              duration: 0.6,
              ease: "power1.inOut",
              onUpdate: function () {
                kickerEl.textContent = kickerText.substring(0, Math.floor(kickerProxy.v));
              },
            },
            0.35,
          );

          // Scene 2 — wordmark slides up + fades in as one calm move (long-tail power3,
          // no bounce, per the video's motion grammar).
          tl.fromTo(
            "#f2-wordmark",
            { y: 50, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
            2.0,
          );

          // Scene 2 — lime underline draws on left to right (svg-path-draw.md: power2.out,
          // no back.out/elastic — a pen doesn't bounce).
          tl.to(
            "#f2-underline-line",
            { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
            2.6,
          );

          // Scene 3 — source caption fades in; the card holds still to the end (the
          // breather before the pocket run begins).
          tl.fromTo(
            "#f2-caption",
            { opacity: 0 },
            { opacity: 1, duration: 0.4, ease: "power1.out" },
            3.2,
          );

          window.__timelines["02-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
