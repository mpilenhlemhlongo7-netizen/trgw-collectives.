<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- head is metadata only for this source file; the HyperFrames runtime
         only clones <template> contents at render time, see hyperframes-core. -->
  </head>
  <body>
    <template>
      <style>
        /* Root styled via #root only (never a class on the data-composition-id
           element) — the compositor scopes rules to [data-composition-id], and a
           class on the root itself would stop matching. See hyperframes-core. */
        #root {
          position: relative;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          container-type: size;
          font-family: sans-serif;
          color: #faf8f2;
        }

        /* Full-bleed navy ground — a dedicated clip child, never a #root background
           (root is clip-gated at assembly and a root background can render black). */
        .bg-field {
          position: absolute;
          inset: 0;
          background: #0c1b32;
        }

        .kicker {
          position: absolute;
          top: 13%;
          left: 0;
          width: 100%;
          text-align: center;
          font-family: monospace;
          font-weight: 700;
          font-size: 3.4cqw;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #faf8f2;
        }

        .ring-stage {
          position: absolute;
          top: 30%;
          left: 50%;
          width: 52cqw;
          height: 52cqw;
          margin-left: -26cqw;
          will-change: transform;
        }

        .ring-svg {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
        }

        .ring-track {
          fill: none;
          stroke: rgba(250, 248, 242, 0.16);
          stroke-width: 16;
        }

        .ring-fill {
          fill: none;
          stroke: #a6ce39;
          stroke-width: 16;
          stroke-linecap: round;
          transform: rotate(-90deg);
          transform-origin: 100px 100px;
        }

        .ring-readout {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }

        .counter-wrap {
          display: flex;
          align-items: baseline;
          justify-content: center;
        }

        .counter {
          font-family: sans-serif;
          font-weight: 900;
          font-variant-numeric: tabular-nums;
          letter-spacing: -0.02em;
          line-height: 1;
          color: #faf8f2;
          font-size: 13cqw;
        }

        .counter-suffix {
          font-family: sans-serif;
          font-weight: 800;
          line-height: 1;
          color: #a6ce39;
          font-size: 8cqw;
          opacity: 0;
        }

        .marker {
          position: absolute;
          top: 27%;
          left: 65cqw;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          padding: 0.9cqw 2cqw;
          background: #faf8f2;
          border: 0.22cqw solid #0c1b32;
          border-radius: 999px;
          font-family: monospace;
          font-weight: 700;
          font-size: 2.6cqw;
          letter-spacing: 0.06em;
          color: #0c1b32;
          opacity: 0;
          transform-origin: 50% 50%;
          will-change: transform;
        }

        .caption {
          position: absolute;
          top: 63%;
          left: 0;
          width: 100%;
          padding: 0 9cqw;
          text-align: center;
          font-family: monospace;
          font-weight: 700;
          font-size: 3.6cqw;
          line-height: 1.35;
          letter-spacing: 0.04em;
          text-transform: uppercase;
          color: #ce712c;
        }

        .caption .word {
          display: inline-block;
          opacity: 0;
          margin: 0 0.35em 0 0;
        }
      </style>

      <div
        id="root"
        data-composition-id="05-petty-cash"
        data-width="1080"
        data-height="1920"
        data-duration="3.5"
      >
        <div id="pc-bg" class="bg-field clip" data-start="0" data-duration="3.5" data-track-index="0"></div>

        <div id="pc-kicker" class="kicker clip" data-start="0" data-duration="3.5" data-track-index="1">
          <span id="pc-kicker-text"></span>
        </div>

        <div id="pc-ring-stage" class="ring-stage clip" data-start="0" data-duration="3.5" data-track-index="2">
          <svg class="ring-svg" viewBox="0 0 200 200">
            <circle class="ring-track" cx="100" cy="100" r="82" />
            <circle id="pc-ring-fill" class="ring-fill" cx="100" cy="100" r="82" />
          </svg>
          <div class="ring-readout">
            <div class="counter-wrap">
              <span id="pc-counter" class="counter">0</span><span id="pc-suffix" class="counter-suffix">%</span>
            </div>
          </div>
        </div>

        <div id="pc-marker" class="marker clip" data-start="0" data-duration="3.5" data-track-index="3">3/5</div>

        <div id="pc-caption" class="caption clip" data-start="0" data-duration="3.5" data-track-index="4">
          <span class="word">FOR</span><span class="word">THE</span><span class="word">SMALL</span><span class="word">STUFF.</span><span class="word">GUILT-FREE.</span>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // ---- Scene 1 (0.0-1.1s): "PETTY CASH" kicker types on (smooth char-slice
        // typewriter — discrete-text-sequence.md, smooth-slice variation). Empty
        // ring (track + "0") is already present in static HTML, no entrance tween. ----
        const KICKER_TEXT = "PETTY CASH";
        const kickerEl = document.getElementById("pc-kicker-text");
        const kickerDriver = { len: 0 };
        tl.to(
          kickerDriver,
          {
            len: KICKER_TEXT.length,
            duration: 0.85,
            ease: "power1.inOut",
            onUpdate: () => {
              kickerEl.textContent = KICKER_TEXT.substring(0, Math.floor(kickerDriver.len));
            },
          },
          0.15,
        );

        // ---- Scene 2 (1.1-2.4s): ring fills lime + number counts 0->15 as one
        // beat (counting-dynamic-scale.md paired with stat-bars-and-fills.md ring
        // form / svg-path-draw.md draw mechanics), then "3/5" marker pips in
        // (spring-pop-entrance.md, smooth power3 settle — no bounce, per this
        // video's motion grammar). ----
        const ring = document.getElementById("pc-ring-fill");
        const RING_LEN = ring.getTotalLength(); // measured, not hard-coded
        ring.style.strokeDasharray = RING_LEN;
        ring.style.strokeDashoffset = RING_LEN;

        const TARGET_PCT = 15;
        const COUNT_START = 1.1;
        const COUNT_DUR = 1.0;
        const COUNT_EASE = "power3.out";

        // Ring stroke draw and number count-up share the same start/duration/ease
        // so the graphic and the digits land as one beat.
        tl.to(
          ring,
          {
            strokeDashoffset: RING_LEN * (1 - TARGET_PCT / 100),
            duration: COUNT_DUR,
            ease: COUNT_EASE,
          },
          COUNT_START,
        );

        const counterEl = document.getElementById("pc-counter");
        const counterState = { value: 0 };
        tl.to(
          counterState,
          {
            value: TARGET_PCT,
            duration: COUNT_DUR,
            ease: COUNT_EASE,
            onUpdate: () => {
              counterEl.textContent = Math.round(counterState.value).toString();
            },
          },
          COUNT_START,
        );

        // Suffix "%" arrives after the count lands. Bounce is banned by this
        // video's motion grammar ("long-tail power3 eases throughout, no
        // bounce"), so the suffix settles on power3.out rather than back.out.
        tl.to(
          "#pc-suffix",
          { opacity: 1, duration: 0.3, ease: "power3.out" },
          COUNT_START + COUNT_DUR,
        );

        // "3/5" progress marker pips in mid-count (spring-pop-entrance, smooth
        // default variant: fromTo scale 0->1, power3.out, no overshoot).
        tl.fromTo(
          "#pc-marker",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" },
          1.4,
        );

        // ---- Scene 3 (2.4-3.5s): caption builds word-by-word beneath the ring,
        // a touch lighter/faster than Frames 3-4; ring holds with faint jitter only. ----
        const words = gsap.utils.toArray("#pc-caption .word");
        const CAPTION_START = 2.4;
        const CAPTION_STAGGER = 0.09;
        words.forEach((el, i) => {
          tl.fromTo(
            el,
            { opacity: 0, y: 10 },
            { opacity: 1, y: 0, duration: 0.32, ease: "power3.out" },
            CAPTION_START + i * CAPTION_STAGGER,
          );
        });

        // Faint hold jitter on the settled ring (sine-wave-loop.md, low end of
        // amplitude range) — starts after the suffix lands so there is no jump
        // from the settled state, finite window only.
        const jitterPhase = { p: 0 };
        const JITTER_START = COUNT_START + COUNT_DUR + 0.3; // 2.4s
        const JITTER_DUR = 3.5 - JITTER_START;
        tl.to(
          jitterPhase,
          {
            p: Math.PI * 2 * 0.4,
            duration: JITTER_DUR,
            ease: "none",
            onUpdate: () => {
              const s = 1 + Math.sin(jitterPhase.p) * 0.01;
              const y = Math.sin(jitterPhase.p) * 2;
              document.getElementById("pc-ring-stage").style.transform =
                "translateY(" + y + "px) scale(" + s + ")";
            },
          },
          JITTER_START,
        );

        window.__timelines["05-petty-cash"] = tl;
      </script>
    </template>
  </body>
</html>
